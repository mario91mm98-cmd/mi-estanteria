<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#1b1410">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Mi Estantería</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Playfair+Display:wght@600;800&family=Oswald:wght@400;600&family=Josefin+Sans:wght@400;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  --room:#1b1410; --ui:#241a14ee; --ui2:#33261dee; --ink:#f4ead9; --muted:#bba98f; --gold:#e7c26a; --accent:#e7c26a;
  --row-h:240px; --surf:9px; --edge:18px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:"Josefin Sans",ui-sans-serif,system-ui,sans-serif;color:var(--ink);
  background:var(--room);overflow:hidden;user-select:none;-webkit-user-select:none;
}
button{font:inherit;color:inherit}
input,textarea,select{user-select:text;-webkit-user-select:text}

/* ---------------- escena ---------------- */
#scene{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;background:var(--room-bg,var(--room));background-size:cover}
#scene::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 120% 80% at 50% 30%,transparent 40%,rgba(0,0,0,.55));z-index:1}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:flex-start;gap:10px;padding:calc(12px + var(--safe-t)) 16px 14px;
  background:linear-gradient(180deg,rgba(10,7,5,.85),rgba(10,7,5,.55) 70%,transparent)}
.topbar h1{font-family:"Fraunces",Georgia,serif;font-weight:500;font-size:1.65rem;margin:0;line-height:1.1;letter-spacing:.2px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.topbar .sub{font-size:.85rem;color:var(--muted);margin-top:3px}
.topbar .grow{flex:1;min-width:0}
.pillbar{display:flex;gap:2px;background:rgba(30,22,16,.75);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:4px}
.ib{width:44px;height:44px;border-radius:999px;border:none;background:transparent;display:grid;place-items:center;cursor:pointer;font-size:1.15rem}
.ib:active{transform:scale(.94)}
.ib.hot{background:var(--gold);color:#2a1d10}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn-done{background:var(--gold);color:#2a1d10;border:none;border-radius:999px;padding:12px 22px;font-family:"Fraunces",serif;font-weight:700;font-size:1.05rem;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.4)}

.wrap{position:relative;z-index:2;padding:4px 10px calc(130px + var(--safe-b));display:flex;justify-content:center}
.case{position:relative;width:min(980px,100%);padding:0 var(--side) 0;
  background-image:var(--case-v);background-size:auto 900px;box-shadow:0 40px 60px -20px rgba(0,0,0,.8),0 0 0 1px rgba(0,0,0,.4)}
.case::before,.case::after{content:"";position:absolute;top:0;bottom:0;width:var(--side);pointer-events:none;
  background:linear-gradient(90deg,rgba(255,255,255,.12),rgba(255,255,255,0) 30%,rgba(0,0,0,.25) 85%,rgba(0,0,0,.45))}
.case::before{left:0}
.case::after{right:0;transform:scaleX(-1)}
.crown{height:calc(var(--edge) + 10px);margin:0 calc(-1 * var(--side));background-image:var(--board-tex);background-size:900px 100%;position:relative;
  box-shadow:0 10px 14px -6px rgba(0,0,0,.6)}
.crown::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.04) 30%,rgba(0,0,0,.05) 70%,rgba(0,0,0,.4))}
.plinth{height:34px;margin:0 calc(-1 * var(--side));background-image:var(--board-tex);background-size:900px 100%;position:relative}
.plinth::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,.1) 25%,rgba(0,0,0,.25) 80%,rgba(0,0,0,.6))}
.inner{position:relative;background-image:var(--back-img);background-size:var(--back-size,256px);background-color:var(--back-col,#2a1d14)}
.inner.light-off::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.18);pointer-events:none}

.shelf{position:relative}
.row{position:relative;height:var(--row-h);display:flex;align-items:flex-end;gap:1px;padding:0 10px var(--foot,5px);
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;overscroll-behavior-x:contain}
.row::-webkit-scrollbar{display:none}
.shelf .ao{position:absolute;inset:0 0 auto 0;height:100%;pointer-events:none;z-index:4;
  background:
    linear-gradient(180deg,rgba(0,0,0,.62),rgba(0,0,0,.22) 26px,rgba(0,0,0,0) 70px),
    linear-gradient(90deg,rgba(0,0,0,.38),transparent 34px,transparent calc(100% - 34px),rgba(0,0,0,.38))}
.shelf .glow{position:absolute;left:0;right:0;top:0;height:100%;pointer-events:none;z-index:5;mix-blend-mode:screen;display:none}
.lights-calida .glow,.lights-guirnalda .glow{display:block;background:radial-gradient(ellipse 75% 85% at 50% -8%,rgba(255,190,110,.32),rgba(255,170,90,.08) 55%,transparent 75%)}
.lights-calida .shelf .led{display:block}
.led{display:none;position:absolute;top:0;left:6%;right:6%;height:3px;border-radius:3px;background:#fff1cf;box-shadow:0 0 6px 2px rgba(255,214,150,.9),0 0 22px 6px rgba(255,180,90,.35);z-index:6;pointer-events:none}
.surface{position:absolute;left:0;right:0;bottom:0;height:var(--surf);z-index:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.15) 60%,rgba(255,255,255,.06)),var(--board-tex);background-size:100% 100%,900px 100%}
.board{position:relative;z-index:7;height:var(--edge);background-image:var(--board-tex);background-size:900px 100%;
  box-shadow:0 9px 12px -4px rgba(0,0,0,.65)}
.board::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.28) 0,rgba(255,255,255,.08) 2px,rgba(255,255,255,0) 30%,rgba(0,0,0,.12) 75%,rgba(0,0,0,.5))}
.mold-clasica .board{height:calc(var(--edge) + 9px)}
.mold-clasica .board::after{content:"";position:absolute;left:0;right:0;bottom:0;height:9px;
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.55) 0 3px,rgba(255,255,255,.08) 3px 4px,transparent 4px 9px),linear-gradient(180deg,rgba(0,0,0,.4),rgba(0,0,0,.15));border-top:1px solid rgba(255,255,255,.18)}
.mold-redonda .board::before{background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,.12) 20%,rgba(0,0,0,0) 45%,rgba(0,0,0,.25) 80%,rgba(0,0,0,.6));border-radius:0 0 6px 6px}
.mold-fina .board{height:calc(var(--edge) * .55)}
.garland{position:absolute;left:0;right:0;top:calc(100% - 4px);height:44px;z-index:8;pointer-events:none;display:none}
.lights-guirnalda .shelf:not(:last-child) .garland{display:block}
.garland .b{animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.55}}

.shelf-tools{display:none;position:absolute;z-index:12;top:calc(100% - 4px);left:6px;right:6px;justify-content:space-between;pointer-events:none}
.editing .shelf-tools{display:flex}
.shelf-tools .grp{display:flex;gap:6px;pointer-events:auto;background:rgba(20,14,10,.75);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:999px;padding:3px;transform:translateY(-50%)}
.sb{width:34px;height:34px;border-radius:999px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);display:grid;place-items:center;cursor:pointer;font-size:.95rem}
.sb.on{background:var(--gold);color:#2a1d10}
.empty-hint{margin:auto;align-self:center;color:rgba(255,255,255,.4);font-family:"Fraunces",serif;font-style:italic;font-size:.95rem;pointer-events:none;z-index:3}

/* ---------------- elementos ---------------- */
.item{position:relative;flex:0 0 auto;z-index:2;transform-origin:bottom center}
.item>.cs{position:absolute;left:-2px;right:-2px;bottom:-3px;height:8px;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,rgba(0,0,0,.7),rgba(0,0,0,0) 70%);z-index:-1;pointer-events:none}
.item.dragging{opacity:.2}
.editing .item{cursor:grab;touch-action:none}
.editing .item:not(.locked) .vis{outline:1px dashed rgba(231,194,106,.45);outline-offset:2px}
@keyframes wob{from{transform:rotate(-.5deg)}to{transform:rotate(.5deg)}}
.lockbadge{display:none;position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;background:rgba(15,10,6,.85);color:var(--gold);font-size:11px;place-items:center;z-index:9;pointer-events:none;box-shadow:0 0 0 1px rgba(231,194,106,.5)}
.editing .item.locked .lockbadge{display:grid}
.item.lean{margin-left:var(--lm,10px)}
.item.lean>.vis{transform:rotate(-7deg);transform-origin:bottom left}
.item.selected .vis{outline:2px solid var(--gold);outline-offset:2px}

/* lomo */
.spine{position:relative;overflow:hidden;background-color:var(--c);color:var(--t);border-radius:2px 2px 1px 1px;
  box-shadow:1px 0 1px rgba(0,0,0,.55),-1px 0 1px rgba(0,0,0,.35),0 -1px 0 rgba(0,0,0,.25)}
.spine.bind-dura{border-radius:5px 5px 2px 2px/4px 4px 1px 1px}
.spine .tx,.cvr .tx,.face .tx{position:absolute;inset:0;background-image:var(--tex);background-size:var(--tex-s,64px);pointer-events:none}
.spine .art{position:absolute;inset:0;background-image:var(--art);background-size:auto 100%;background-position:0 0;filter:saturate(1.05)}
.spine .art::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.18)}
.spine .photo{position:absolute;inset:0;background-image:var(--ph);background-size:100% 100%}
.spine .sh{position:absolute;inset:0;pointer-events:none;
  background:
   linear-gradient(90deg,rgba(0,0,0,.5) 0,rgba(0,0,0,.12) 7%,rgba(255,255,255,.04) 14%,rgba(255,255,255,.2) 27%,rgba(255,255,255,.07) 44%,rgba(0,0,0,0) 62%,rgba(0,0,0,.14) 84%,rgba(0,0,0,.55) 100%),
   linear-gradient(180deg,rgba(255,236,200,.14),rgba(255,255,255,0) 22%,rgba(0,0,0,0) 70%,rgba(0,0,0,.22))}
.spine.bind-blanda .sh{background:
   linear-gradient(90deg,rgba(0,0,0,.42) 0,rgba(0,0,0,.08) 5%,rgba(255,255,255,.1) 20%,rgba(255,255,255,.05) 60%,rgba(0,0,0,.08) 90%,rgba(0,0,0,.45) 100%),
   linear-gradient(180deg,rgba(255,236,200,.1),rgba(255,255,255,0) 20%,rgba(0,0,0,0) 75%,rgba(0,0,0,.2))}
.spine.bind-dura::after{content:"";position:absolute;left:0;right:0;top:0;height:100%;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.22) 0,rgba(0,0,0,.3) 2px,transparent 6px,transparent calc(100% - 6px),rgba(0,0,0,.35) calc(100% - 2px),rgba(255,255,255,.12))}
.fin-brillo .gl{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 22%,rgba(255,255,255,.28) 30%,rgba(255,255,255,.06) 36%,transparent 46%)}
.spine .txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:var(--pt,10%) 0 var(--pb,7%);z-index:2}
.al-arriba .txt{justify-content:flex-start;gap:6%}
.al-abajo .txt{justify-content:flex-end;gap:6%}
.st,.sa{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.05;font-family:var(--font);text-shadow:0 0 1px rgba(0,0,0,.25)}
.dir-up .st,.dir-up .sa{writing-mode:vertical-rl;transform:rotate(180deg);max-height:72%}
.dir-down .st,.dir-down .sa{writing-mode:vertical-rl;max-height:72%}
.dir-down .txt{flex-direction:column-reverse}
.dir-h .st{white-space:normal;text-align:center;width:92%;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.dir-h .sa{white-space:normal;text-align:center;width:90%}
.sa{text-transform:uppercase;letter-spacing:.09em;opacity:.88}
.spine.has-art .st,.spine.has-art .sa{text-shadow:0 1px 3px rgba(0,0,0,.8),0 0 1px rgba(0,0,0,.9)}
.gold-t .st,.gold-t .sa,.gold-t .ct,.gold-t .ca{background:linear-gradient(180deg,#fff0b8,#d9a94a 40%,#f7dd8d 55%,#a77628);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 .6px 0 rgba(0,0,0,.6))}
.spine .mk{font-size:9px;opacity:.75}
.dec{position:absolute;left:0;right:0;pointer-events:none;z-index:1}
.dec.band{height:2.2%;background:var(--t);opacity:.85}
.dec.gline{height:1px;background:linear-gradient(90deg,#9b6e22,#f5d98a,#9b6e22);box-shadow:0 3px 0 -1px #c9a14d}
.dec.rib{height:3.4%;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.04) 35%,rgba(0,0,0,.15) 65%,rgba(0,0,0,.5));box-shadow:0 1px 1px rgba(0,0,0,.4)}
.dec.label{left:12%;right:12%;background:#efe5cc;box-shadow:0 0 0 1px rgba(0,0,0,.25),inset 0 0 6px rgba(120,90,40,.3);border-radius:1px}
.dec.block{bottom:0;height:24%;background:var(--t)}
.on-label .st{color:#2a2017!important;background:none!important;filter:none!important;text-shadow:none}

/* tumbado y canto */
.lying,.edgev{position:relative}
.lying>.spine{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(90deg)}
.edgev{background:var(--edgec,#efe6d2);border-radius:1px;overflow:hidden;box-shadow:1px 0 1px rgba(0,0,0,.5),-1px 0 1px rgba(0,0,0,.3)}
.edgev .pg{position:absolute;inset:var(--bt,2px) var(--bw,2px);background:
  repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 1px,rgba(255,255,255,.06) 1px 2px,rgba(0,0,0,0) 2px 3px),
  linear-gradient(90deg,rgba(0,0,0,.25),rgba(0,0,0,0) 18%,rgba(255,255,255,.08) 50%,rgba(0,0,0,0) 82%,rgba(0,0,0,.25)),
  linear-gradient(180deg,rgba(255,240,210,.12),rgba(0,0,0,.12)),var(--edgec,#efe6d2)}
.edgev .cb{position:absolute;top:0;bottom:0;width:var(--bw,2px);background:var(--c)}
.edgev .cb.l{left:0}.edgev .cb.r{right:0}
.edgev .photo{position:absolute;inset:0;background:var(--ph) center/100% 100%}

/* portada 3D */
.b3d{position:relative;transform-style:preserve-3d}
.face{position:absolute;top:0;left:0;height:100%;overflow:hidden}
.face.front,.face.back{width:100%}
.face.front{border-radius:1px 3px 3px 1px}
.cvr{position:absolute;inset:0;background-color:var(--c);color:var(--t);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12% 10%}
.cvr .img{position:absolute;inset:0;background:var(--ph) center/cover}
.cvr .hinge{position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(90deg,rgba(0,0,0,.42) 0,rgba(255,255,255,.18) 2.6%,rgba(0,0,0,.2) 4.2%,rgba(0,0,0,0) 8%,rgba(0,0,0,0) 92%,rgba(0,0,0,.18)),
  linear-gradient(160deg,rgba(255,240,215,.16),rgba(255,255,255,0) 35%,rgba(0,0,0,0) 65%,rgba(0,0,0,.2))}
.ct{font-family:var(--font);font-weight:700;line-height:1.08;z-index:2;position:relative;overflow-wrap:anywhere}
.ca{font-family:var(--font);text-transform:uppercase;letter-spacing:.12em;opacity:.9;z-index:2;position:relative;margin-top:10%}
.cvr .frame{position:absolute;inset:6%;border:1.5px solid #d4ac55;box-shadow:inset 0 0 0 3px transparent,inset 0 0 0 4px #b98d3b;pointer-events:none}
.cvr .cband{position:absolute;left:0;right:0;height:5%;background:var(--t);opacity:.85}
.cvr .clabel{position:absolute;left:14%;right:14%;top:24%;height:30%;background:#efe5cc;box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.cvr .cblock{position:absolute;left:0;right:0;bottom:0;height:30%;background:var(--t)}
.face.pages{background:
  repeating-linear-gradient(90deg,rgba(0,0,0,.09) 0 1px,rgba(255,255,255,.05) 1px 2px,transparent 2px 3px),
  linear-gradient(90deg,rgba(0,0,0,.25),rgba(0,0,0,0) 30%,rgba(0,0,0,.1)),var(--edgec,#efe6d2);top:3px;height:calc(100% - 6px)}
.face.spf{background-color:var(--c)}
.face.spf .sh{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(255,255,255,.12) 40%,rgba(0,0,0,.3))}
.face.back .cvr .hinge{transform:scaleX(-1)}

/* adornos */
.deco{display:flex;align-items:flex-end;justify-content:center}
.deco svg{display:block;height:100%;width:auto;overflow:visible}
.deco.flip svg,.deco.flip .em,.deco.flip img{transform:scaleX(-1)}
.deco .em{line-height:1;filter:drop-shadow(2px 5px 4px rgba(0,0,0,.5))}
.deco img{height:100%;width:auto;display:block;filter:drop-shadow(3px 6px 6px rgba(0,0,0,.55))}
.flick{animation:flick 1.7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{0%{transform:scale(1,1)}35%{transform:scale(.93,1.07) skewX(2deg)}70%{transform:scale(1.03,.96) skewX(-1.5deg)}100%{transform:scale(.97,1.04)}}
.halo{animation:halo 2.2s ease-in-out infinite alternate}
@keyframes halo{from{opacity:.75}to{opacity:1}}
.steam{animation:steam 3.5s ease-in-out infinite}
@keyframes steam{0%{opacity:0;transform:translateY(6px)}30%{opacity:.7}100%{opacity:0;transform:translateY(-14px)}}

/* arrastre */
.ghost{position:fixed;pointer-events:none;z-index:200;opacity:.95;filter:drop-shadow(0 18px 18px rgba(0,0,0,.55));transform:scale(1.06) rotate(2deg)}
.marker{position:absolute;bottom:4px;top:18px;width:4px;border-radius:2px;background:var(--gold);box-shadow:0 0 12px var(--gold);z-index:20;pointer-events:none}
.trash{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translate(-50%,180%);z-index:150;background:#8f2f23;color:#fff;padding:16px 28px;border-radius:999px;font-weight:700;transition:transform .2s;box-shadow:0 10px 24px rgba(0,0,0,.5);visibility:hidden}
.trash.show{transform:translate(-50%,0);visibility:visible}
.trash.hot{background:#d6432f;transform:translate(-50%,0) scale(1.08)}

/* barra inferior */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + var(--safe-b));z-index:40;display:flex;gap:4px;padding:6px;border-radius:999px;
  background:rgba(28,20,15,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.08);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.dock .ib{width:54px;height:50px}
.dock .ib.sel{background:rgba(255,255,255,.12)}
.hintpill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + var(--safe-b));z-index:39;background:rgba(28,20,15,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.08);
  padding:10px 18px;border-radius:999px;font-family:"Cormorant Garamond",serif;font-style:italic;font-size:1.08rem;text-align:center;max-width:92vw;display:none}
.editing .hintpill{display:block}

/* hojas */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.overlay.clear{background:transparent}
.sheet{width:min(640px,100%);max-height:86vh;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:#201711;
  border:1px solid rgba(255,255,255,.08);border-radius:26px 26px 0 0;padding:10px 18px calc(18px + var(--safe-b));box-shadow:0 -20px 50px rgba(0,0,0,.5);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:26px;padding-bottom:18px}}
.grab{width:42px;height:5px;border-radius:3px;background:rgba(255,255,255,.25);margin:2px auto 12px}

<script>
"use strict";
/* =====================================================================
   Mi Estantería · app personal. Todo se guarda en este dispositivo.
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ======================= texturas procedurales ======================= */
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const PERM=(()=>{const r=mulberry(11),p=[...Array(256).keys()];for(let i=255;i>0;i--){const j=Math.floor(r()*(i+1));[p[i],p[j]]=[p[j],p[i]]}return Uint8Array.from(p)})();
const h2=(i,j)=>PERM[(PERM[i&255]+j)&255]/255;
function vn(x,y,px,py){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const x0=((xi%px)+px)%px,x1=(x0+1)%px,y0=((yi%py)+py)%py,y1=(y0+1)%py;
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),a=h2(x0,y0),b=h2(x1,y0),c=h2(x0,y1),d=h2(x1,y1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y,px,py,o=4){let s=0,a=1,t=0,f=1;for(let i=0;i<o;i++){s+=a*vn(x*f,y*f,px*f,py*f);t+=a;a*=.5;f*=2}return s/t}
const rgb=h=>{h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]};
const hex=a=>'#'+a.map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('');
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const mul=(a,f)=>[a[0]*f,a[1]*f,a[2]*f];
function canvasTex(w,h,fn,jpg){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d'),im=x.createImageData(w,h),d=im.data;
  for(let y=0;y<h;y++)for(let X=0;X<w;X++){const v=fn(X,y),i=(y*w+X)*4;d[i]=v[0];d[i+1]=v[1];d[i+2]=v[2];d[i+3]=v.length>3?v[3]:255}
  x.putImageData(im,0,0);return c.toDataURL(jpg?'image/jpeg':'image/png',.9)}
const TEXC={};
function tex(key,make){return TEXC[key]||(TEXC[key]=make())}
function grain(x,y,W,H,rings=14){const n=fbm(x/W*2,y/H*3,2,3,4);const g=y/H*rings+n*2.4;const ring=Math.pow(.5+.5*Math.sin(g*Math.PI*2),4);
  const streak=fbm(x/W*8,y/H*96,8,96,2);const fine=vn(x/W*64,y/H*192,64,192);
  return clamp(.3+.26*ring+.3*(n-.5)+.42*(streak-.5)+.22*(fine-.5)+(Math.random()-.5)*.05,0,1)}
function woodTex(w,vertical){const W=900,H=48;
  if(w.lac){const C=rgb(w.l);return canvasTex(vertical?H:W,vertical?W:H,(X,Y)=>{const [x,y]=vertical?[Y,X]:[X,Y];const n=fbm(x/W*4,y/H*1,4,1,3);return mul(C,.94+.08*n+(Math.random()-.5)*.03)},true)}
  const L=rgb(w.l),D=rgb(w.d);return canvasTex(vertical?H:W,vertical?W:H,(X,Y)=>{const [x,y]=vertical?[Y,X]:[X,Y];return mix(L,D,grain(x,y,W,H))},true)}
function overlayTex(kind){return tex('ov-'+kind,()=>{
  if(kind==='tela')return canvasTex(64,64,(x,y)=>{const w=((x>>1)+(y>>1))%2;const r=Math.random();return w?[255,255,255,10+r*16]:[0,0,0,18+r*22]});
  if(kind==='piel')return canvasTex(128,128,(x,y)=>{const n=fbm(x/128*10,y/128*10,10,10,3);const p=vn(x/128*48,y/128*48,48,48);const a=Math.abs(n-.5)*80+(p>.72?30:0)+Math.random()*10;return n<.5?[0,0,0,a]:[255,240,220,a*.6]});
  if(kind==='papel')return canvasTex(128,128,()=>{const r=Math.random();return r<.5?[0,0,0,r*16]:[255,255,255,(r-.5)*14]});
  if(kind==='brillo')return canvasTex(64,64,()=>[255,255,255,Math.random()*6]);
  if(kind==='room')return canvasTex(160,160,(x,y)=>{const n=fbm(x/160*4,y/160*4,4,4,4);return[0,0,0,clamp((n-.3)*70+Math.random()*12,0,255)]});
})}

function backTex(key,tintHex,woodKey){
  const T=rgb(tintHex||BACKS[key].tint||'#666');
  return tex(`bk-${key}-${tintHex}-${key==='tablones'||key==='paneles'?woodKey:''}`,()=>{
    const S=256,R=Math.random;
    switch(key){
    case 'pintado':return canvasTex(S,S,(x,y)=>{const n=fbm(x/S*4,y/S*4,4,4,4);return mul(T,1+(n-.5)*.12+(R()-.5)*.035)},true);
    case 'tablones':{const w=WOODS[woodKey]&&!WOODS[woodKey].lac?WOODS[woodKey]:WOODS.roble;const L=mul(rgb(w.l),.78),D=mul(rgb(w.d),.62);
      return canvasTex(S,S,(x,y)=>{const xp=x%64,pi=Math.floor(x/64);let c=mix(L,D,grain(y+pi*97,x,S,S));if(xp<2)c=mul(c,.4);else if(xp===2)c=mul(c,1.18);return c},true)}
    case 'paneles':{const w=WOODS[woodKey]&&!WOODS[woodKey].lac?WOODS[woodKey]:WOODS.nogal;const L=mul(rgb(w.l),.72),D=mul(rgb(w.d),.55);
      return canvasTex(S,S,(x,y)=>{let c=mix(L,D,grain(y,x,S,S));const lx=x%128,ly=y%128;const inP=lx>16&&lx<112&&ly>14&&ly<114;
        if(lx<3||ly<3)c=mul(c,.55);
        else if(inP){const e=Math.min(lx-16,112-lx,ly-14,114-ly);if(e<6){const lit=(lx-16<6||ly-14<6)&&!(112-lx<6||114-ly<6);c=mul(c,lit?1.22:.62)}else c=mul(c,.9)}
        else{const e=Math.min(Math.abs(lx-16),Math.abs(lx-112),Math.abs(ly-14),Math.abs(ly-114));if(e<2)c=mul(c,.7)}
        return c},true)}
    case 'ladrillo':{const pal=['#9a4b34','#b5603f','#874130','#a8563a','#94503a','#7d3b2a'].map(rgb),M=rgb('#c9bca8');
      return canvasTex(256,240,(x,y)=>{const row=Math.floor(y/24),off=(row%2)*32,xx=(x+off)%256,bx=Math.floor(xx/64),lx=xx%64,ly=y%24;
        if(lx>=61||ly>=21)return mul(M,.85+R()*.2);const b=pal[Math.floor(h2(bx+row*7,row)*pal.length)];const n=fbm(x/256*8,y/240*5,8,5,3);
        let c=mul(b,.82+.36*n+(R()-.5)*.1);const e=Math.min(lx,60-lx,ly,20-ly);if(e<2)c=mul(c,.86);return c},true)}
    case 'hormigon':return canvasTex(S,S,(x,y)=>{const n=fbm(x/S*5,y/S*5,5,5,5);let f=.82+.3*n+(R()-.5)*.05;if(R()<.004)f*=.6;return mul([168,163,155],f)},true);
    case 'marmol':return canvasTex(S,S,(x,y)=>{const v=fbm(x/S*3,y/S*3,3,3,5),s=Math.sin(2*Math.PI*(x/S+y/S*2+v*2.6)),s2=Math.sin(2*Math.PI*(x/S*2-y/S+v*3.4));
        const vein=Math.pow(1-Math.abs(s),22)*.55+Math.pow(1-Math.abs(s2),40)*.35;return mix(mul([242,239,234],.96+.06*v+(R()-.5)*.02),[128,122,116],clamp(vein,0,1))},true);
    case 'terciopelo':return canvasTex(S,S,(x,y)=>{const n=fbm(x/S*2,y/S*3,2,3,4),f=fbm(x/S*16,y/S*1,16,1,2);return mul(T,.62+.62*n+.12*(f-.5)+(R()-.5)*.06)},true);
    case 'lino':return canvasTex(S,S,(x,y)=>{const sl=(vn(x/S*16,y/S*256,16,256)-.5)*.1+(vn(x/S*256,y/S*16,256,16)-.5)*.1;let f=1+sl+(R()-.5)*.07;if(x%3===0)f-=.05;if(y%3===0)f-=.04;return mul([214,202,182],f)},true);
    case 'corcho':return canvasTex(S,S,(x,y)=>{const n=fbm(x/S*32,y/S*32,32,32,3);const t=clamp((n-.42)/.14,0,1);let c=mix([132,84,44],[214,168,112],t);c=mul(c,.88+R()*.22);if(R()<.012)c=mul(c,.55);return c},true);
    case 'azulejo':return canvasTex(S,S,(x,y)=>{const row=Math.floor(y/32),off=(row%2)*32,xx=(x+off)%S,lx=xx%64,ly=y%32;if(lx>=61||ly>=29)return mul([182,178,170],.9+R()*.15);
        const e=Math.min(lx,60-lx,ly,28-ly);let f=1+(h2(Math.floor(xx/64),row)-.5)*.06+(R()-.5)*.02;if(e<4)f*=(lx<4||ly<4)?1.06+e*.0:.86+e*.03;const g=ly<10?.05*(1-ly/10):0;return mul(T,f+g)},true);
    case 'estrellas':return canvasTex(S,S,(x,y)=>{const n=fbm(x/S*3,y/S*3,3,3,5),m=fbm(x/S*6+3,y/S*6,6,6,3);let c=mix([10,14,34],[48,40,92],clamp((n-.35)*1.6,0,1));c=mix(c,[90,40,90],clamp((m-.6)*1.4,0,.5));
        const r=R();if(r<.0025)c=[255,250,235];else if(r<.008)c=mix(c,[220,220,255],.6);return c},true);
    case 'rayas':return canvasTex(S,S,(x,y)=>{const st=(x%32)<16;const n=fbm(x/S*4,y/S*4,4,4,3);let c=st?T:mul(T,.8);if(x%32===0||x%32===16)c=mix(c,[200,170,110],.5);return mul(c,.95+.08*n+(R()-.5)*.03)},true);
    case 'punto':return canvasTex(S,S,(x,y)=>{const cx=x%16,cy=y%12;const v=Math.abs(Math.sin((cx/16)*Math.PI)*Math.sin(((cy+(cx<8?cy:-cy))/12)*Math.PI));
        const cable=(x%64)<32?Math.abs(Math.sin((y/S*8+ (x%32)/32)*Math.PI)):.5;let f=.78+.22*v+.08*cable+(R()-.5)*.05;if(cx===0||cx===8)f-=.12;return mul(T,f)},true);
    case 'botanico':{const leaf=hex(mix(mix(T,[60,90,60],.75),[0,0,0],.1));const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><rect width='160' height='160' fill='${hex(T)}'/>`+
      [[40,46,-20],[120,124,160],[118,40,60],[38,124,240]].map(([x,y,r])=>`<g transform='translate(${x} ${y}) rotate(${r})' fill='${leaf}' opacity='.55'><path d='M0 30 C2 10 0 -10 0 -32' stroke='${leaf}' stroke-width='1.6' fill='none'/>`+
      [-24,-14,-4,6,16].map((yy,i)=>`<ellipse cx='${i%2?7:-7}' cy='${yy}' rx='6' ry='3' transform='rotate(${i%2?-35:35} ${i%2?7:-7} ${yy})'/>`).join('')+`<ellipse cx='0' cy='-34' rx='3' ry='6'/></g>`).join('')+`</svg>`;
      return 'data:image/svg+xml,'+encodeURIComponent(svg)}
    }
  })}

function G(p,id,stops,lin='x1="0" x2="1" y1="0" y2="0"'){return `<linearGradient id="${p}${id}" ${lin}>${stops.map((c,i)=>`<stop offset="${(i/(stops.length-1)).toFixed(3)}" stop-color="${c}"/>`).join('')}</linearGradient>`}
function RG(p,id,stops,attr='cx=".35" cy=".35" r=".75"'){return `<radialGradient id="${p}${id}" ${attr}>${stops.map(([o,c,a])=>`<stop offset="${o}" stop-color="${c}"${a!=null?` stop-opacity="${a}"`:''}/>`).join('')}</radialGradient>`}

<filter id="${p}bl"><feGaussianBlur stdDeviation="1.4"/></filter><filter id="${p}bl4"><feGaussianBlur stdDeviation="5"/></filter>

  if(!st||!st.shelves)return null;

  if(typeof st.settings.light==='boolean'){st.settings.lights=st.settings.light?'calida':'ninguna';delete st.settings.light}
  if(!WOODS[st.settings.wood])st.settings.wood='roble';if(!BACKS[st.settings.back])st.settings.back='tablones';
  st.shelves.forEach(s=>{s.items=s.items.map(it=>{

      const nb=newBook({id:it.id,title:it.title,author:it.author,color:it.color||'#7b2d26',text:it.text||'',status:it.status||'',rating:it.rating||0,notes:it.notes||'',year:it.year||'',pages:it.pages||'',

function hsl(h){let[r,g,b]=rgb(h).map(v=>v/255);const M=Math.max(r,g,b),m=Math.min(r,g,b),l=(M+m)/2;let H=0,s=0;if(M!==m){const d=M-m;s=l>.5?d/(2-M-m):d/(M+m);H=M===r?(g-b)/d+(g<b?6:0):M===g?(b-r)/d+2:(r-g)/d+4;H*=60}return[H,s,l]}
function avgColor(src){return new Promise(res=>{const im=new Image();im.crossOrigin='anonymous';im.onload=()=>{try{const c=document.createElement('canvas');c.width=c.height=20;const x=c.getContext('2d');x.drawImage(im,0,0,20,20);const d=x.getImageData(0,0,20,20).data;
  let best=null;let r=0,g=0,b=0,n=0;for(let i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];b+=d[i+2];n++}const avg=[r/n,g/n,b/n];
  // color del borde izquierdo (donde va el lomo)
  let lr=0,lg=0,lb=0,ln=0;for(let y=0;y<20;y++)for(let x2=0;x2<4;x2++){const i=(y*20+x2)*4;lr+=d[i];lg+=d[i+1];lb+=d[i+2];ln++}
  res({avg:hex(avg),left:hex([lr/ln,lg/ln,lb/ln])})}catch(e){res(null)}};im.onerror=()=>res(null);im.src=src})}
function fileToData(file,max=900){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
  const x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);const png=file.type==='image/png';res(c.toDataURL(png?'image/png':'image/jpeg',.86))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
function pickImage(useCam){return new Promise(res=>{const inp=useCam?$('#camIn'):$('#fileIn');inp.value='';inp.onchange=async()=>{const f=inp.files[0];if(!f)return res(null);try{res(await fileToData(f))}catch(e){toast('No se pudo leer la imagen');res(null)}};inp.click()})}

function spineHTML(b,W,H){

  const avail=H*.66;let fs=dir==='h'?Math.min(W*.16,H*.06):Math.min(W*.5,avail/(Math.max(4,t.length)*.58));fs=clamp(fs,6.5,PX*2.1);

  else txt=`<div class="txt ${lbl?'on-label':''}" style="${b.style==='bloque'?'--pb:30%;':''}"><div class="st" style="font-size:${fs.toFixed(1)}px${b.style==='etiqueta'?';max-height:56%':''}">${esc(t)}</div>${b.style==='bloque'?`<div class="sa" style="font-size:${fa}px;position:absolute;bottom:${dir==='h'?'6%':'4%'};color:var(--c);${dir==='h'?'':'max-height:20%'}">${esc(a)}</div>`:`<div class="sa" style="font-size:${fa}px">${esc(a)}</div>`}</div>`;
  return `<div class="spine bind-${b.binding} fin-${b.finish} dir-${dir} al-${b.align} ${gold?'gold-t':''} ${art?'has-art':''}" style="width:${W}px;height:${H}px;--c:${b.color};--t:${textCol(b)};--font:${FONTS[b.font]||FONTS.clasica};${texVars(b)};${b.age?`filter:saturate(${1-b.age*.35}) sepia(${b.age*.18}) brightness(${1-b.age*.06})`:''}">
   <div class="tx"></div>${art?`<div class="art" style="--art:url('${art}')"></div>`:''}${ph?`<div class="photo" style="--ph:url('${ph}')"></div>`:dec}${txt}${b.finish==='brillo'?'<div class="gl"></div>':''}<div class="sh"></div>${b.age>.3&&!ph?`<div style="position:absolute;inset:0;box-shadow:inset 0 0 ${3+b.age*6}px rgba(255,240,210,${b.age*.35});pointer-events:none"></div>`:''}</div>`}
function lastName(a){a=(a||'').split(',')[0].trim();if(!a)return'';const p=a.split(/\s+/);return p.length>1?p[p.length-1]:a}

function book3D(b,W,H,D,ry=-16,rx=0){

   <div class="face back" style="transform:translateZ(${-D/2}px) rotateY(180deg)">${coverHTML(b,'back')}</div>
   <div class="face pages" style="width:${D}px;left:${W-D/2}px;transform:rotateY(90deg)"></div>
   <div class="face spf" style="width:${D}px;left:${-D/2}px;transform:rotateY(-90deg)">${spineHTML(b,D,H).replace('class="spine','style="position:absolute;inset:0" data-x class="spine')}</div>
   <div class="face front" style="transform:translateZ(${D/2}px)">${coverHTML(b)}</div></div>`}
function edgeHTML(b,W,H){const ph=imgSrc(b.imgs.edge);const bw=b.binding==='dura'?Math.max(1.5,PX*.25):Math.max(1,PX*.08);

function itemEl(it){
  const el=document.createElement('div');el.className='item'+(it.locked?' locked':'');el.dataset.id=it.id;let html='';
  if(it.type==='book'){
    const H=Math.round(it.h*PX),T=Math.max(5,Math.round(it.t*PX)),W=Math.round(it.w*PX);
    if(it.mode==='cover'){html=`<div class="vis">${book3D(it,W,H,T,-14)}</div>`;el.style.width=W+'px';el.style.marginLeft=Math.round(T*.4)+'px';if(it.lean){el.classList.add('lean');el.style.setProperty('--lm',Math.round(H*.12)+'px')}}
    else if(it.mode==='lying'){html=`<div class="vis"><div class="lying" style="width:${H}px;height:${T}px">${spineHTML(it,T,H)}</div></div>`}
    else if(it.mode==='edge'){html=`<div class="vis">${edgeHTML(it,T,H)}</div>`}
    else{html=`<div class="vis">${spineHTML(it,T,H)}</div>`;if(it.lean){el.classList.add('lean');el.style.setProperty('--lm',Math.round(H*.12)+'px')}}
  }else{

    else if(def.emoji)html=`<div class="vis deco ${it.flip?'flip':''}" style="height:${H}px"><span class="em" style="font-size:${H}px">${esc(it.emoji||'🦉')}</span></div>`;

function garlandSVG(w){const n=Math.max(2,Math.round(w/150)),seg=w/n;let d=`M0 6`,bulbs='';
  for(let i=0;i<n;i++){const x0=i*seg,x1=x0+seg;d+=` Q${x0+seg/2} 34 ${x1} 6`;for(let k=1;k<8;k++){const t=k/8,x=x0+seg*t,y=6+(1-Math.pow(2*t-1,2))*14+ (k%2?4:0);bulbs+=`<g class="b" style="animation-delay:${((i*7+k)%9)*-.37}s"><circle cx="${x.toFixed(1)}" cy="${(y+3).toFixed(1)}" r="6" fill="url(#gbh)"/><circle cx="${x.toFixed(1)}" cy="${(y+3).toFixed(1)}" r="1.8" fill="#fff6d8"/></g>`}}
  return `<svg width="${w}" height="44" viewBox="0 0 ${w} 44"><defs><radialGradient id="gbh"><stop offset="0" stop-color="#ffe9b0" stop-opacity=".95"/><stop offset=".35" stop-color="#ffc35c" stop-opacity=".55"/><stop offset="1" stop-color="#ff9d2e" stop-opacity="0"/></radialGradient></defs><path d="${d}" stroke="#3a2a1a" stroke-width="1.1" fill="none"/>${bulbs}</svg>`}

let drag=null,lpT=null;
$('#case').addEventListener('pointerdown',e=>{
  const el=e.target.closest('.item');if(!el||e.button>0)return;
  drag={el,id:el.dataset.id,x:e.clientX,y:e.clientY,started:false,armed:editing};
  clearTimeout(lpT);
  lpT=setTimeout(()=>{if(drag&&!drag.started&&!drag.moved){drag.armed=true;navigator.vibrate?.(15);startDrag(drag.x,drag.y)}},editing?330:520);
});
function startDrag(x,y){
  const f=findItem(drag.id);if(!f)return;
  if(f.item.locked){toast('Está fijado 🔒 · desbloquéalo para moverlo');drag=null;return}
  drag.started=true;const r=drag.el.getBoundingClientRect();drag.dx=x-r.left;drag.dy=y-r.top;
  const g=drag.el.cloneNode(true);g.classList.add('ghost');g.style.width=r.width+'px';g.style.height=r.height+'px';g.style.left=r.left+'px';g.style.top=r.top+'px';g.style.animation='none';
  document.body.appendChild(g);drag.ghost=g;drag.el.classList.add('dragging');drag.marker=document.createElement('div');drag.marker.className='marker';$('#trash').classList.add('show');
  $('#scene').style.overflowY='hidden'}
window.addEventListener('pointermove',e=>{
  if(!drag)return;
  if(!drag.started){const d=Math.hypot(e.clientX-drag.x,e.clientY-drag.y);if(d>8){if(editing&&drag.armed&&d>8&&e.pointerType==='mouse'){clearTimeout(lpT);startDrag(drag.x,drag.y)}else{drag.moved=true;clearTimeout(lpT);if(!editing)drag=null}}if(!drag||!drag.started)return}
  e.preventDefault();
  drag.ghost.style.left=(e.clientX-drag.dx)+'px';drag.ghost.style.top=(e.clientY-drag.dy)+'px';
  const tr=$('#trash').getBoundingClientRect();const ot=e.clientY>tr.top-24&&e.clientX>tr.left-30&&e.clientX<tr.right+30;
  $('#trash').classList.toggle('hot',ot);drag.target=null;drag.marker.remove();if(ot){drag.target='trash';return}
  // autodesplazamiento vertical
  if(e.clientY<90)$('#scene').scrollTop-=10;else if(e.clientY>innerHeight-140)$('#scene').scrollTop+=10;
  let row=null;for(const r of $$('.row')){const b=r.parentElement.getBoundingClientRect();if(e.clientY>=b.top&&e.clientY<=b.bottom){row=r;break}}
  if(!row)return;
  const sh=S.shelves.find(s=>s.id===row.dataset.shelf);
  const kids=[...row.children].filter(k=>k.dataset.start!==undefined&&!k.classList.contains('dragging'));
  const rb=row.getBoundingClientRect();let idx=null,mx=null;
  for(const k of kids){const kb=k.getBoundingClientRect();if(e.clientX<kb.left+kb.width/2){idx=+k.dataset.start;mx=kb.left-rb.left+row.scrollLeft-3;break}}
  if(idx===null){idx=sh.items.length;const l=kids[kids.length-1];mx=l?l.getBoundingClientRect().right-rb.left+row.scrollLeft+1:12}
  if(e.clientX>rb.right-30)row.scrollLeft+=8;else if(e.clientX<rb.left+30)row.scrollLeft-=8;
  drag.target={shelf:sh.id,index:idx};drag.marker.style.left=mx+'px';row.appendChild(drag.marker);
},{passive:false});
window.addEventListener('pointerup',()=>{
  clearTimeout(lpT);if(!drag)return;const d=drag;drag=null;$('#scene').style.overflowY='';
  if(!d.started){if(d.moved)return;const f=findItem(d.id);if(!f)return;f.item.type==='book'?(editing?openEditor(f.item):openViewer(f.item)):openDecoEdit(f.item);return}
  d.ghost.remove();d.marker.remove();d.el.classList.remove('dragging');$('#trash').classList.remove('show','hot');
  const f=findItem(d.id);if(!f||!d.target){render();return}
  if(d.target==='trash'){removeItem(d.id);return}
  const dest=S.shelves.find(s=>s.id===d.target.shelf);let idx=d.target.index;f.shelf.items.splice(f.index,1);if(dest===f.shelf&&idx>f.index)idx--;dest.items.splice(idx,0,f.item);save();render()});
window.addEventListener('pointercancel',()=>{clearTimeout(lpT);if(drag&&drag.started){drag.ghost.remove();drag.marker.remove();$('#trash').classList.remove('show','hot');$('#scene').style.overflowY='';render()}drag=null});

function openAdd(shelfId){
  shelfId=shelfId||S.shelves[0].id;
  const sh=openSheet(`<h2>Añadir libro</h2>
   <div style="display:flex;gap:8px"><input type="search" id="q" placeholder="Título, autor o ISBN" enterkeyhint="search" autocomplete="off"><button class="btn pri" id="qGo">Buscar</button></div>

   <div class="act"><button class="btn grow" id="manual">✍️ Añadir a mano</button><button class="btn" id="scanCover">📷 Foto de la portada</button></div>

  $('#scanCover',sh).onclick=async()=>{const d=await pickImage(true);if(!d)return;const b=newBook();b.imgs.cover=await Store.putImg(d);b.mode='cover';const c=await avgColor(d);if(c){b.color=c.left;b.text=readable(c.left)}placeNew(b,$('#shSel',sh).value);openEditor(b,true,'datos')};
  setTimeout(()=>$('#q',sh).focus(),250)}
async function doSearch(q,box,onPick){
  if(!q)return;box.innerHTML='<p class="hint">Buscando…</p>';
  let res=[];
  try{const r=await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(q)}&maxResults=24&printType=books`);const j=await r.json();
    res=(j.items||[]).map(it=>{const v=it.volumeInfo||{};const il=v.imageLinks||{};let th=(il.thumbnail||il.smallThumbnail||'').replace('http://','https://').replace('&edge=curl','');
      const dim=v.dimensions||{};const cm=s=>s?parseFloat(String(s).replace(',','.')):null;
      return{src:'g',title:v.title+(v.subtitle&&v.title.length<30?'':''),author:(v.authors||[]).join(', '),year:(v.publishedDate||'').slice(0,4),pages:v.pageCount||'',genre:(v.categories||[])[0]||'',
        isbn:((v.industryIdentifiers||[]).find(x=>x.type==='ISBN_13')||{}).identifier||'',thumb:th,big:th?th.replace(/zoom=\d/,'zoom=1')+'&fife=w600-h900':'',h:cm(dim.height),w:cm(dim.width),t:cm(dim.thickness),lang:v.language}})}catch(e){}
  if(!res.length){try{const r=await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&limit=20&fields=title,author_name,cover_i,number_of_pages_median,first_publish_year,subject`);const j=await r.json();
    res=(j.docs||[]).map(d=>({src:'o',title:d.title,author:(d.author_name||[]).join(', '),year:d.first_publish_year||'',pages:d.number_of_pages_median||'',genre:(d.subject||[])[0]||'',thumb:d.cover_i?`https://covers.openlibrary.org/b/id/${d.cover_i}-M.jpg`:'',big:d.cover_i?`https://covers.openlibrary.org/b/id/${d.cover_i}-L.jpg`:''}))}catch(e){}}
  if(!res.length){box.innerHTML='<p class="hint">No he encontrado nada (o no hay conexión). Prueba con otras palabras o añádelo a mano.</p>';return}
  box.innerHTML=res.map((r,i)=>`<div class="res" data-i="${i}"><div class="th" style="${r.thumb?`background-image:url('${r.thumb}')`:''}">${r.thumb?'':esc(r.title)}</div><div><b>${esc(r.title)}</b><div class="meta">${esc(r.author)}${r.year?' · '+r.year:''}${r.pages?' · '+r.pages+' págs.':''}</div></div></div>`).join('');
  box.onclick=e=>{const el=e.target.closest('.res');if(el)onPick(res[+el.dataset.i])}}
function loadImg(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i.naturalWidth>40?src:null);i.onerror=()=>r(null);i.src=src})}
async function toLocal(url){try{const r=await fetch(url,{mode:'cors'});if(!r.ok)return null;const bl=await r.blob();if(bl.size<1500)return null;return await fileToData(new File([bl],'c',{type:bl.type}),900)}catch(e){return null}}
async function addFromResult(r,shelfId){
  toast('Añadiendo…');
  const b=newBook({title:r.title||'',author:r.author||'',year:r.year||'',pages:r.pages||'',genre:r.genre||'',isbn:r.isbn||''});
  if(r.h&&r.h>8&&r.h<45)b.h=Math.round(r.h*10)/10;if(r.w&&r.w>5&&r.w<35)b.w=Math.round(r.w*10)/10;else b.w=Math.round(b.h*.66*10)/10;
  b.t=r.t&&r.t>.3&&r.t<12?Math.round(r.t*10)/10:clamp(Math.round(((+r.pages||300)*.0055+.4)*10)/10,.8,7);
  if(+r.pages&&+r.pages<260)b.binding='blanda';
  let cover=null;
  if(r.big){const okBig=await loadImg(r.big);cover=okBig||(r.thumb?await loadImg(r.thumb):null)}

function openSort(){
  hint('Un toque y los libros se colocan solos (los fijados no se mueven)');
  const sh=openSheet(`<h2>Ordenar libros</h2><div class="grid2" id="sorts">
   ${[['color','🎨 Por color'],['altura','📏 Por altura'],['autor','✍️ Por autor'],['titulo','🔤 Por título'],['saga','📚 Por saga'],['genero','🎭 Por género'],['anio','📅 Por año'],['azar','🔀 Sorpréndeme']].map(([k,n])=>`<button class="chip" style="justify-content:center;padding:13px" data-v="${k}">${n}</button>`).join('')}</div>
   <label class="lbl">Opciones</label><div class="chips"><button class="chip" id="rev">⇄ Invertir orden</button><button class="chip" id="lockAll">🔒 Fijar todos</button><button class="chip" id="unlockAll">🔓 Soltar todos</button></div>
   <p class="hint" style="margin-top:12px">Ordena todos los libros de la estantería respetando los huecos de los que tengas fijados con candado y sin mover los objetos.</p>`,{clear:true});
  $('#sorts',sh).onclick=e=>{const c=e.target.closest('.chip');if(c)sortBooks(c.dataset.v)};
  $('#rev',sh).onclick=()=>sortBooks('rev');
  $('#lockAll',sh).onclick=()=>{forItems(i=>{if(i.type==='book')i.locked=true});save();render();toast('Todos los libros fijados')};
  $('#unlockAll',sh).onclick=()=>{forItems(i=>i.locked=false);S.shelves.forEach(s=>s.locked=false);save();render();toast('Todos sueltos')}}
function sortBooks(how){
  const before=JSON.stringify(S.shelves);
  const slots=[];S.shelves.forEach(s=>s.items.forEach((it,i)=>{if(it.type==='book'&&!it.locked&&!s.locked)slots.push([s,i])}));
  let list=slots.map(([s,i])=>s.items[i]);
  const str=v=>(v||'').toString().toLocaleLowerCase('es');
  const sagaKey=b=>b.saga?str(b.saga)+String(+b.sagaN||0).padStart(4,'0'):'￿'+str(b.title);
  const cmp={
    color:(a,b)=>{const[h1,s1,l1]=hsl(a.color),[h2_,s2,l2]=hsl(b.color);const g1=s1<.15,g2=s2<.15;if(g1!==g2)return g1?1:-1;if(g1)return l2-l1;return h1-h2_||l2-l1},
    altura:(a,b)=>b.h-a.h||b.t-a.t, autor:(a,b)=>str(lastName(a.author)).localeCompare(str(lastName(b.author)),'es')||sagaKey(a).localeCompare(sagaKey(b)),
    titulo:(a,b)=>str(a.title).localeCompare(str(b.title),'es'), saga:(a,b)=>sagaKey(a).localeCompare(sagaKey(b),'es'),
    genero:(a,b)=>(str(a.genre)||'￿').localeCompare(str(b.genre)||'￿','es')||str(lastName(a.author)).localeCompare(str(lastName(b.author)),'es'),
    anio:(a,b)=>(+a.year||9999)-(+b.year||9999)}[how];
  if(how==='azar'){for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]]}}
  else if(how==='rev')list.reverse();else list.sort(cmp);
  slots.forEach(([s,i],k)=>s.items[i]=list[k]);
  save();render();toast('Ordenado',()=>{S.shelves=JSON.parse(before);save();render()})}

function barcode(code){code=(code||'9780000000000').replace(/\D/g,'').padEnd(13,'0');let x=0,bars='';
  for(const ch of code){const d=+ch;for(let k=0;k<4;k++){const w=((d>>k)&1)+1;if(k%2===0)bars+=`<rect x="${x}" y="0" width="${w}" height="30" fill="#111"/>`;x+=w+.6}}
  return `<svg viewBox="0 0 ${x.toFixed(1)} 38" width="100%"><g>${bars}</g><text x="${x/2}" y="37" font-size="6.5" text-anchor="middle" font-family="monospace" fill="#111">${code}</text></svg>`}
function backHTML(b,W){const ph=imgSrc(b.imgs.back);if(ph)return coverHTML(b,'back');const bts=clamp(W*.075,7,22);
  return `<div class="cvr gold-off" style="padding:0;--c:${b.color};--t:${isGold(b)?'#e9c46a':textCol(b)};--font:${FONTS[b.font]};${texVars(b)}"><div class="tx"></div><div class="backgen" style="--bts:${bts}px">
   <div class="bt">${esc(b.title)}</div><div class="bl"></div><div class="ba">${esc(b.author)}</div>${b.desc?`<div class="bd">${esc(b.desc)}</div>`:''}
   <div class="bf"><span>${b.pages?esc(b.pages)+' páginas':''}</span><span class="bc" style="width:38%">${barcode(b.isbn)}</span></div></div><div class="hinge" style="transform:scaleX(-1)"></div></div>`}
function bookSolid(b,W,H,D){
  return `<div class="b3d" id="vBook" style="width:${W}px;height:${H}px;--c:${b.color};--edgec:${b.edge};--cts:${clamp(W*.11,8,30)}px;--cas:${clamp(W*.055,6,14)}px">
   <div class="face back" style="transform:translateZ(${-D/2}px) rotateY(180deg)">${backHTML(b,W)}</div>
   <div class="face pages" style="width:${D}px;left:${W-D/2}px;transform:rotateY(90deg)"></div>
   <div class="face spf" style="width:${D}px;left:${-D/2}px;transform:rotateY(-90deg)">${spineHTML(b,D,H).replace('class="spine','style="position:absolute;inset:0" class="spine')}</div>
   <div class="face topf" style="height:${D}px;top:${-D/2}px;transform:rotateX(90deg)"></div>
   <div class="face botf" style="height:${D}px;top:${H-D/2}px;transform:rotateX(-90deg)"></div>
   <div class="face front" style="transform:translateZ(${D/2}px)">${coverHTML(b)}</div></div>`}
let V=null;
function openViewer(b){
  const st=$('#vStage');const maxH=Math.min(innerHeight*.52,460),maxW=Math.min(innerWidth*.62,380);
  let H=maxH,W=H*b.w/b.h;if(W>maxW){W=maxW;H=W*b.h/b.w}const D=Math.max(10,H*b.t/b.h);
  st.innerHTML=bookSolid(b,Math.round(W),Math.round(H),Math.round(D));
  $('#vTitle').textContent=b.title||'Sin título';$('#vSub').textContent=[b.author,b.pages?b.pages+' páginas':''].filter(Boolean).join(' · ');
  $('#viewer').classList.add('open');
  V={b,ry:-28,rx:-10,vy:0,vx:0,drag:false,raf:null,t0:performance.now()};
  const el=$('#vBook');
  const apply=()=>{el.style.transform=`rotateX(${V.rx}deg) rotateY(${V.ry}deg)`};apply();
  const loop=t=>{if(!V)return;if(!V.drag){V.ry+=V.vy;V.rx+=V.vx;V.vy*=.9;V.vx*=.85;if(Math.abs(V.vy)<.02&&Math.abs(V.vx)<.02){V.vy=0;V.vx=0;V.ry+=Math.sin(t/900)*.04}V.rx=clamp(V.rx,-70,70)}apply();V.raf=requestAnimationFrame(loop)};
  V.raf=requestAnimationFrame(loop);
  let lx=0,ly=0;
  st.onpointerdown=e=>{V.drag=true;lx=e.clientX;ly=e.clientY;st.setPointerCapture(e.pointerId)};
  st.onpointermove=e=>{if(!V||!V.drag)return;const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;V.ry+=dx*.6;V.rx=clamp(V.rx-dy*.4,-70,70);V.vy=dx*.22;V.vx=-dy*.12};
  st.onpointerup=st.onpointercancel=()=>{if(V)V.drag=false};
  if(!b.infoTried)fetchInfo(b).then(ch=>{if(ch&&V&&V.b===b){save();openViewer(b)}});
}
function closeViewer(){if(V&&V.raf)cancelAnimationFrame(V.raf);V=null;$('#viewer').classList.remove('open');$('#vStage').innerHTML=''}
$('#vClose').onclick=closeViewer;$('#vBack').onclick=closeViewer;

/* ---------- información online: sinopsis y valoración ---------- */
const stripHTML=h=>{const d=document.createElement('div');d.innerHTML=(h||'').replace(/<br\s*\/?>/gi,'\n').replace(/<\/p>/gi,'\n\n');return d.textContent.replace(/\n{3,}/g,'\n\n').trim()};
async function fetchInfo(b){
  b.infoTried=true;let changed=false;const last=lastName(b.author);
  try{const q=b.isbn?`isbn:${b.isbn}`:`intitle:${b.title.replace(/[:()]/g,' ')} inauthor:${last}`;
    for(const lang of b.isbn?['']:['&langRestrict=es','']){
      const r=await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(q)}&maxResults=6&printType=books${lang}`);if(!r.ok)break;const j=await r.json();
      const items=(j.items||[]).map(x=>x.volumeInfo||{});const withD=items.find(v=>v.description)||items[0];if(!withD)continue;
      if(!b.desc&&withD.description){b.desc=stripHTML(withD.description);changed=true}
      const rated=items.find(v=>v.averageRating);if(rated&&!b.avgRating){b.avgRating=rated.averageRating;b.ratingsCount=rated.ratingsCount||0;b.ratingSrc='Google Books';changed=true}
      if(!b.pages&&withD.pageCount){b.pages=withD.pageCount;changed=true}if(!b.publisher&&withD.publisher){b.publisher=withD.publisher;changed=true}
      if(!b.year&&withD.publishedDate){b.year=withD.publishedDate.slice(0,4);changed=true}
      if(b.desc)break}}catch(e){}
  if(!b.desc||!b.avgRating){try{
    const r=await fetch(`https://openlibrary.org/search.json?title=${encodeURIComponent(b.title)}&author=${encodeURIComponent(last)}&limit=3&fields=key,ratings_average,ratings_count,first_sentence`);const j=await r.json();const d=(j.docs||[])[0];
    if(d){if(!b.avgRating&&d.ratings_average){b.avgRating=Math.round(d.ratings_average*10)/10;b.ratingsCount=d.ratings_count||0;b.ratingSrc='Open Library';changed=true}
      if(!b.desc&&d.key){const w=await (await fetch(`https://openlibrary.org${d.key}.json`)).json();const ds=typeof w.description==='string'?w.description:(w.description&&w.description.value);if(ds){b.desc=ds.replace(/\(\[source\][^)]*\)/g,'').trim();changed=true}}}}catch(e){}}
  save();return changed}
function starsAvg(v){const p=clamp(v/5*100,0,100);return `<span class="st5" style="--p:${p}%">★★★★★</span>`}
function openDetails(b){
  const draw=()=>{
    const cover=imgSrc(b.imgs.cover);
    const sh=openSheet(`<div class="dhead"><div class="th" style="background-color:${b.color};${cover?`background-image:url('${cover}')`:''}"></div><div style="min-width:0">
      <h2 style="margin:0 0 4px">${esc(b.title)}</h2><div class="hint" style="font-size:.95rem">${esc(b.author)}</div>
      ${b.saga?`<div style="color:var(--gold);font-size:.9rem;margin-top:4px">${esc(b.saga)}${b.sagaN?' · #'+esc(b.sagaN):''}</div>`:''}</div></div>
      <label class="lbl">Valoración de los lectores</label>
      <div class="avg" id="avgBox">${b.avgRating?`${starsAvg(b.avgRating)}<b>${String(b.avgRating).replace('.',',')}</b><span class="hint">${b.ratingsCount?`(${b.ratingsCount} valoraciones · ${b.ratingSrc})`:`(${b.ratingSrc})`}</span>`:`<span class="hint">${b.infoTried?'No he encontrado valoraciones de este libro.':'Buscando…'}</span>`}</div>
      <label class="lbl">Sinopsis</label>
      ${b.desc?`<div class="syn clip" id="syn">${esc(b.desc)}</div><button class="linkbtn" id="more">Leer más</button>`:`<p class="hint">${b.infoTried?'No he encontrado sinopsis. Puedes escribirla tú:':'Buscando sinopsis…'}</p>`}
      ${b.infoTried&&!b.desc?`<textarea id="ownDesc" placeholder="Sinopsis del libro"></textarea>`:''}
      <label class="lbl">Tu valoración</label><div class="stars" id="myR">${[1,2,3,4,5].map(i=>`<span data-v="${i}" class="${i<=b.rating?'on':''}">★</span>`).join('')}</div>
      <label class="lbl">Tu reseña</label><textarea id="myRev" placeholder="¿Qué te ha parecido? Personajes, momentos favoritos, citas…" style="min-height:120px">${esc(b.review||'')}</textarea>
      <div class="row2"><div><label class="lbl">Estado</label><select id="dSt2">${Object.entries(STATUS).map(([k,n])=>`<option value="${k}" ${k===b.status?'selected':''}>${n}</option>`).join('')}</select></div>
        <div><label class="lbl">Ficha</label><div class="hint" style="padding-top:4px">${[b.pages?b.pages+' págs.':'',b.year,b.publisher,b.genre].filter(Boolean).map(esc).join(' · ')||'—'}</div></div></div>
      <div class="act"><button class="btn" id="reInfo">↻ Volver a buscar datos</button><button class="btn pri grow" id="dOk2">Listo</button></div>`,{tall:true});
    if($('#more',sh))$('#more',sh).onclick=e=>{$('#syn',sh).classList.toggle('clip');e.target.textContent=$('#syn',sh).classList.contains('clip')?'Leer más':'Leer menos'};
    if($('#ownDesc',sh))$('#ownDesc',sh).onchange=e=>{b.desc=e.target.value.trim();save()};
    $('#myR',sh).onclick=e=>{const v=+e.target.dataset.v;if(!v)return;b.rating=b.rating===v?0:v;$$('#myR span',sh).forEach(x=>x.classList.toggle('on',+x.dataset.v<=b.rating));save()};
    let rt;$('#myRev',sh).oninput=e=>{b.review=e.target.value;clearTimeout(rt);rt=setTimeout(save,400)};
    $('#dSt2',sh).onchange=e=>{b.status=e.target.value;save();refreshItem(b.id)};
    $('#reInfo',sh).onclick=async()=>{b.desc=b.desc&&b.descOwn?b.desc:'';b.avgRating=0;toast('Buscando…');await fetchInfo(b);draw()};
    $('#dOk2',sh).onclick=closeSheet};
  draw();
  if(!b.infoTried)fetchInfo(b).then(()=>{if($('#ov').classList.contains('open'))draw()});
}

/* ---------- portadas automáticas ---------- */
let coverRun=false;
async function fetchCoverFor(b){
  const last=lastName(b.author);
  // 1) Google Books (edición en español si existe)
  try{const q=`intitle:${b.title.replace(/[:()]/g,' ')} inauthor:${last}`;
    for(const lang of ['&langRestrict=es','']){
      const r=await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(q)}&maxResults=8&printType=books${lang}`);if(!r.ok)break;const j=await r.json();
      const it=(j.items||[]).find(x=>x.volumeInfo&&x.volumeInfo.imageLinks);if(it){const v=it.volumeInfo,th=(v.imageLinks.thumbnail||v.imageLinks.smallThumbnail).replace('http://','https://').replace('&edge=curl','');
        if(!b.pages&&v.pageCount)b.pages=v.pageCount;if(!b.year&&v.publishedDate)b.year=v.publishedDate.slice(0,4);if(!b.genre&&v.categories)b.genre=v.categories[0];
        return (await loadImg(th.replace(/zoom=\d/,'zoom=1')+'&fife=w600-h900'))||(await loadImg(th))}}}catch(e){}
  // 2) Open Library
  try{const r=await fetch(`https://openlibrary.org/search.json?title=${encodeURIComponent(b.title)}&author=${encodeURIComponent(last)}&limit=8&fields=cover_i,language`);const j=await r.json();
    const d=(j.docs||[]).find(x=>x.cover_i&&(x.language||[]).includes('spa'))||(j.docs||[]).find(x=>x.cover_i);if(d)return await loadImg(`https://covers.openlibrary.org/b/id/${d.cover_i}-L.jpg`)}catch(e){}
  return null}
async function autoCovers(){
  if(coverRun)return;coverRun=true;
  const todo=allBooks().filter(b=>b.autoCover&&!b.imgs.cover);let n=0,ok=0;
  for(const b of todo){n++;
    if(n===1||n%5===0)toast(`Buscando portadas… ${n}/${todo.length}`);
    const url=await fetchCoverFor(b);
    if(url){const local=await toLocal(url);b.imgs.cover=local?await Store.putImg(local):url;ok++;refreshItem(b.id)}
    b.autoCover=false;save();await sleep(250)}
  coverRun=false;if(todo.length)toast(`Portadas encontradas: ${ok} de ${todo.length}. Las que falten, ponlas con una foto.`)}
